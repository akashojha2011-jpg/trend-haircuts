<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Great+Vibes&amp;display=swap');
      .serif-t { font-family: 'Playfair Display', 'Cormorant Garamond', serif; font-weight: 700; fill: #1a1a1a; }
      .script-h { font-family: 'Great Vibes', 'Dancing Script', cursive; fill: #d65b7e; }
    </style>
  </defs>

  <!-- Clean Soft White/Rose Rounded Square Badge -->
  <rect width="512" height="512" rx="128" fill="#ffffff"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#f6dce4" stroke-width="8"/>

  <!-- Serif "T" -->
  <text x="130" y="320" font-family="'Playfair Display', serif" font-size="300" font-weight="700" fill="#1a1a1a">T</text>

  <!-- Script "H" -->
  <text x="210" y="360" font-family="'Great Vibes', 'Dancing Script', cursive" font-size="290" fill="#d65b7e">H</text>

  <!-- 4-point Sparkle Star -->
  <path d="M 400 110 Q 400 150 440 150 Q 400 150 400 190 Q 400 150 360 150 Q 400 150 400 110 Z" fill="#d65b7e"/>
</svg>