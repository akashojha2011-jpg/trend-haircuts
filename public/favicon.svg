<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#e0a96d"/>
      <stop offset="100%" stop-color="#c88b4a"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Square / Circle Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Stylized "TH" Monogram with Scissor Curve Aesthetic -->
  <!-- Letter T -->
  <path d="M 120 160 L 320 160 M 220 160 L 220 360" stroke="url(#goldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Letter H / Scissors Ribbon -->
  <path d="M 290 220 L 290 360 M 290 290 L 390 290 M 390 220 L 390 360" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Sparkle Accent -->
  <path d="M 390 140 Q 390 180 430 180 Q 390 180 390 220 Q 390 180 350 180 Q 390 180 390 140 Z" fill="url(#goldGrad)"/>
  <circle cx="140" cy="360" r="12" fill="url(#goldGrad)"/>
</svg>
